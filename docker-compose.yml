services:
  # 우리가 만든 Spring Boot 앱
  app:
    build: ./corebridge-core  # corebridge-core 안에 있는 Dockerfile로 빌드
    ports:
      - "8080:8080"           # 서버포트:컨테이너포트 (외부에서 8080으로 접속 가능)
    env_file:
      - .env                  # .env 파일에서 환경변수 읽어옴
    depends_on:
      - db                    # db, redis, elasticsearch가 먼저 실행된 후에 앱 시작
      - redis
      - elasticsearch
    volumes:
      - upload_data:/app/uploads  # 업로드 파일 저장 위치 (컨테이너 재시작해도 파일 유지)

  # MariaDB 데이터베이스
  db:
    image: mariadb:10.11      # 공식 MariaDB 이미지 사용
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}  # root 비밀번호 (.env에서 가져옴)
      MYSQL_DATABASE: ${DB_NAME}                # 생성할 DB 이름
      MYSQL_USER: ${DB_USERNAME}                # DB 접속 유저
      MYSQL_PASSWORD: ${DB_PASSWORD}            # DB 접속 비밀번호
    volumes:
      - db_data:/var/lib/mysql  # DB 데이터 저장 위치 (컨테이너 재시작해도 데이터 유지)

  # Redis (토큰/캐시 저장용)
  redis:
    image: redis:7-alpine     # 공식 Redis 이미지 사용 (alpine = 용량 작은 버전)
    ports:
      - "6379:6379"

  # Elasticsearch (build.gradle 버전 8.15.2에 맞춤)
  elasticsearch:
    image: elasticsearch:8.15.2
    environment:
      - discovery.type=single-node        # 단일 노드 모드로 실행 (개발/로컬용)
      - xpack.security.enabled=false      # 보안 비활성화 (로컬이라 불필요)
      - ES_JAVA_OPTS=-Xms512m -Xmx512m   # 메모리 최대 512MB로 제한 (안하면 너무 많이 먹음)
    command: >
      bash -c "
        bin/elasticsearch-plugin list | grep -q analysis-nori || bin/elasticsearch-plugin install analysis-nori &&
        bin/elasticsearch
      "

    ports:
      - "9200:9200"                       # Elasticsearch HTTP 포트
    volumes:
      - es_data:/usr/share/elasticsearch/data  # 데이터 유지 (컨테이너 재시작해도 인덱스 유지)

  # Logstash (DB 데이터를 Elasticsearch로 1분마다 동기화)
  logstash:
    image: logstash:8.15.2                # elasticsearch와 버전 맞춤
    depends_on:
      - elasticsearch                     # elasticsearch 먼저 뜬 후 시작
      - db                                # db 먼저 뜬 후 시작
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline  # 로컬 파이프라인 파일 마운트
      - jdbc_jar:/opt/jdbc                # JDBC 드라이버 저장 위치
    command: bash -c "mkdir -p /opt/jdbc && logstash"


volumes:
  db_data:      # DB 데이터 보관용 볼륨
  upload_data:  # 업로드 파일 보관용 볼륨
  es_data:      # Elasticsearch 인덱스 데이터 보관용 볼륨
  jdbc_jar:     # MariaDB JDBC 드라이버 보관용 볼륨