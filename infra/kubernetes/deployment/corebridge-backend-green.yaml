apiVersion: apps/v1
kind: Deployment
metadata:
  name: corebridge-backend-green
  namespace: corebridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: corebridge-backend
      version: green
  template:
    metadata:
      labels:
        app: corebridge-backend
        version: green
    spec:
      containers:
        - name: backend
          image: halo1234/corebridge-backend:74
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: corebridge-config
            - secretRef:
                name: corebridge-secret

          # Health checks
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3

      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
