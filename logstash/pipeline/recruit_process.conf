input {
  jdbc {
    jdbc_driver_library => "/opt/jdbc/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://db:3306/corebridge?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "halo"
    jdbc_password => "qwer1234"
    schedule => "* * * * *"
    statement => "
      SELECT
        rp.id AS process_id,
        rp.name AS stage_name,
        rp.order_idx AS order_index,
        jp.id AS job_posting_id,
        jp.title AS job_posting_title,
        d.name AS department_name,
        COUNT(r.id) AS applicant_count
      FROM recruit_process rp
      JOIN job_posting jp ON jp.id = rp.job_posting_id
      JOIN department d ON d.id = jp.department_id
      LEFT JOIN resume r ON r.process_id = rp.id
      GROUP BY rp.id, rp.name, rp.order_idx, jp.id, jp.title, d.name"
  }
}

filter {
  mutate {
    rename => {
      "stage_name" => "stageName"
      "order_index" => "orderIndex"
      "applicant_count" => "count"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "recruit_process"
  }
  stdout { codec => rubydebug }
}