input {
  jdbc {
    jdbc_driver_library => "/opt/jdbc/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://db:3306/corebridge?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "halo"
    jdbc_password => "qwer1234"
    schedule => "* * * * *"
    statement => "
      SELECT
        jp.id,
        jp.title,
        jp.employment_type,
        jp.career_type,
        jp.apply_start_date,
        jp.hire_end_date,
        d.name AS department_name,
        (SELECT COUNT(*) FROM resume r WHERE r.job_posting_id = jp.id) AS applicant_count
      FROM job_posting jp
      JOIN department d ON d.id = jp.department_id"
  }
}

filter {
  ruby {
    code => '
      require "date"
      start_date = DateTime.parse(event.get("apply_start_date").to_s) rescue nil
      end_date   = DateTime.parse(event.get("hire_end_date").to_s) rescue nil
      now        = DateTime.now

      status =
        if start_date && now < start_date
          "예정"
        elsif end_date && now > end_date
          "마감"
        else
          "채용중"
        end
      event.set("status", status)

      if end_date
        diff = (end_date.to_date - Date.today).to_i
        event.set("dday", diff > 0 ? "D-#{diff}" : diff == 0 ? "D-Day" : "마감")
      end

      if start_date && end_date
        total_days = (end_date.to_date - start_date.to_date).to_i
        passed_days = (Date.today - start_date.to_date).to_i
        progress = (passed_days.to_f / total_days.to_f * 100).round rescue 0
        progress = [[progress, 0].max, 100].min
        event.set("progress_percent", progress)
      else
        event.set("progress_percent", 0)
      end

      career_label = case event.get("career_type")
                     when "EXPERIENCED" then "경력"
                     when "ENTRY" then "신입"
                     when "ANY" then "무관"
                     else "기타"
                     end

      employment_label = case event.get("employment_type")
                         when "FULL_TIME" then "정규직"
                         when "CONTRACT" then "계약직"
                         when "INTERN" then "인턴"
                         else "기타"
                         end
      event.set("summaryText", "#{career_label} · #{employment_label}")
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "jobPostings"
  }
  stdout { codec => rubydebug }
}